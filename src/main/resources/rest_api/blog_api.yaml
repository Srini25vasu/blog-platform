# Blog api

openapi: 3.0.0
info:
  title: "Blog platform API"
  version: "1.0.0"
  contact:
    name: Blog service
    email: contact@example.com
    url: https://example.com/
tags:
  - name: BlogService
    description: BlogService related requests
paths:
  /api/v1/blogs:
    post:
      operationId: saveBlog
      summary: Save blog
      tags: [ 'BlogService' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blog'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog' 
    get:
      operationId: getBlogs
      summary: Get all blogs for the given user id
      tags: [ 'BlogService' ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Blog'

  /api/v1/blogs/{id}:
    get:
      operationId: getBlog
      summary: Get blog by id
      tags: [ 'BlogService' ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'

components:
  schemas:
    Blog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
        content:
          type: object
        description:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        author:
          type: string