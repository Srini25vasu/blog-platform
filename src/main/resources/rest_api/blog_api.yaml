# Blog api

openapi: 3.0.0
info:
  title: "Blog platform API"
  version: "1.0.0"
  contact:
    name: Blog service
    email: contact@example.com
    url: https://example.com/
tags:
  - name: BlogService
    description: BlogService related requests
paths:
  /api/v1/blogs:
    post:
      operationId: saveBlog
      summary: Save blog
      tags: [ 'BlogService' ]
      parameters:
        - in: header
          name: X-Idempotency-Key
          required: true
          schema:
            type: string
          description: "Unique identifier for the request to ensure idempotency. Same key will return the same response for duplicate requests."
        - in: header
          name: X-API-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blog'
      responses:
        '200':
          description: OK
          headers:
            X-RateLimit-Limit:
              schema:
                type: integer
                format: int32
                description: The number of requests allowed per hour
            X-RateLimit-Remaining:
              schema:
                type: integer
                format: int32
                description: The number of requests left for the current rate limit window.
            X-RateLimit-Reset:
              schema:
                type: integer
                format: int32 
                description: The UTC date/time at which the current rate limit window resets.
            X-Idempotency-Key:
              schema:
                type: string  
                description: The idempotency key that was provided in the request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog' 
    get:
      operationId: getBlogs
      summary: Get all blogs for the given user id
      tags: [ 'BlogService' ]
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
          description: "Page number (0-based)"
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: "Number of items per page"
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: "id,desc"
          description: "Sort criteria in the format: property,direction (e.g., id,desc or title,asc)"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedBlogResponse'

  /api/v1/blogs/{id}:
    get:
      operationId: getBlog
      summary: Get blog by id
      tags: [ 'BlogService' ]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blog'

components:
  schemas:
    PagedBlogResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Blog'
          description: "List of blogs for the current page"
        pageable:
          $ref: '#/components/schemas/Pageable'
        totalElements:
          type: integer
          format: int64
          description: "Total number of blogs"
        totalPages:
          type: integer
          description: "Total number of pages"
        last:
          type: boolean
          description: "Whether this is the last page"
        first:
          type: boolean
          description: "Whether this is the first page"
        numberOfElements:
          type: integer
          description: "Number of elements in the current page"
        size:
          type: integer
          description: "Size of the page"
        number:
          type: integer
          description: "Current page number"
        sort:
          $ref: '#/components/schemas/Sort'
        empty:
          type: boolean
          description: "Whether the page is empty"
    
    Pageable:
      type: object
      properties:
        sort:
          $ref: '#/components/schemas/Sort'
        offset:
          type: integer
          format: int64
        pageSize:
          type: integer
        pageNumber:
          type: integer
        paged:
          type: boolean
        unpaged:
          type: boolean
    
    Sort:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    
    Blog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          maxLength: 255
        slug:
          type: string
          maxLength: 255
        content:
          type: object
        description:
          type: string
        status:
          type: string
          enum:
            - DRAFT
            - PUBLISHED
            - ARCHIVED
        author:
          type: string