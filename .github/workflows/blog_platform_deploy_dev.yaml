name: Blog platform deploy dev
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Build
        run: mvn --batch-mode --fail-fast clean package -DskipTests -T 1C
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/cust_app:latest



      # - name: Upload artifact
      #   if: github.ref == 'refs/heads/main'
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: blog-platform-jar
      #     path: target/*.jar
      #     retention-days: 5

  deploy:
    name: Deploy to OpenShift
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    env:
      APP_NAME: blog-platform
      IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/cust_app:latest
      NAMESPACE: ${{ secrets.OPENSHIFT_NAMESPACE }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Log in to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} \
            --server=${{ secrets.OPENSHIFT_SERVER }} \
            --insecure-skip-tls-verify=true
          oc project ${{ env.NAMESPACE }}

      - name: Create or update deployment
        run: |
          # Create app if it does not exist yet, otherwise update the image
          if oc get deployment ${{ env.APP_NAME }} -n ${{ env.NAMESPACE }} > /dev/null 2>&1; then
            echo "Deployment exists – updating image..."
            oc set image deployment/${{ env.APP_NAME }} \
              ${{ env.APP_NAME }}=${{ env.IMAGE }} \
              -n ${{ env.NAMESPACE }}
          else
            echo "Deployment not found – creating new app..."
            oc new-app --name=${{ env.APP_NAME }} \
              --docker-image=${{ env.IMAGE }} \
              -n ${{ env.NAMESPACE }}
          fi

      - name: Expose service (creates Route if missing)
        run: |
          if ! oc get route ${{ env.APP_NAME }} -n ${{ env.NAMESPACE }} > /dev/null 2>&1; then
            oc expose svc/${{ env.APP_NAME }} -n ${{ env.NAMESPACE }}
          fi

      - name: Wait for rollout to complete
        run: |
          oc rollout status deployment/${{ env.APP_NAME }} \
            -n ${{ env.NAMESPACE }} --timeout=180s

      - name: Print public route URL
        run: |
          echo "App URL: https://$(oc get route ${{ env.APP_NAME }} \
            -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.spec.host}')"

